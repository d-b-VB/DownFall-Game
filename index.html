<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DownFall Prototype</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family: Inter, system-ui, sans-serif; background:#111; color:#eee; }
    #ui { position:fixed; top:8px; left:8px; background:#0008; padding:8px 10px; border-radius:8px; z-index:10; font-size:14px; }
    #help { position:fixed; bottom:8px; left:8px; background:#0008; padding:8px 10px; border-radius:8px; font-size:12px; }
    button { margin-top:6px; }
    canvas { display:block; width:100vw; height:100vh; }
  </style>
</head>
<body>
  <div id="ui"></div>
  <div id="help">WASD move · Mouse aim · Click/hold attack · Space alternate attack · 1-7 weapon select (unlocked) · R reset world</div>
  <canvas id="game"></canvas>
  <script src="main.js"></script>
</body>
</html>
