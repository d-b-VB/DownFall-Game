<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DownFall Prototype</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font-family: Inter, system-ui, sans-serif; background:#111; color:#eee; }
    #ui { position:fixed; top:8px; left:8px; max-width:min(760px,calc(100vw - 36px)); background:#000b; padding:8px 10px; border-radius:8px; z-index:10; font-size:14px; }
    .shop-section { margin-top:8px; padding-top:7px; border-top:1px solid #ffffff33; }
    .shop-section strong { color:#ffe28a; }
    #help { position:fixed; top:8px; right:8px; background:#0008; padding:8px 10px; border-radius:8px; font-size:12px; }
    #menu { position:fixed; inset:0; display:grid; place-items:center; background:#111d; z-index:20; }
    #menu.hidden { display:none; }
    .menu-card { background:#1e2522; border:1px solid #ffffff33; border-radius:14px; padding:22px 26px; text-align:center; box-shadow:0 18px 70px #000a; }
    .menu-card h1 { margin:0 0 6px; }
    .menu-card p { margin:0 0 14px; color:#cbd5cf; }
    button { margin-top:6px; margin-right:4px; }
    canvas { display:block; width:100vw; height:100vh; }
  </style>
</head>
<body>
  <div id="menu"><div class="menu-card"><h1>DownFall</h1><p>Choose a mode.</p><button type="button" data-mode="game">Play Game</button><button type="button" data-mode="glyph">Glyph Test</button></div></div>
  <div id="ui"></div>
  <div id="help">WASD move · Mouse aim · Click/hold attack · Space alternate attack · 1-7 weapon select (unlocked) · M toggle horse · reward: click or 1-3 · R reset world</div>
  <canvas id="game"></canvas>
  <script src="main.js"></script>
</body>
</html>
